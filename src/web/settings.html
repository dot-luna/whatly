<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc:; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
    <meta name="color-scheme" content="light dark">
    <title>Whatly Settings</title>
    <link rel="stylesheet" href="settings.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js" defer></script>
    <script src="settings.js" defer></script>
</head>
<body>
    <div class="settings-shell">
        <header class="panel-header">
            <div class="title-row">
                <button id="close-settings" class="icon-button" type="button" aria-label="Back to WhatsApp settings" title="Back to WhatsApp settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.42-1.41L7.83 13H20z"/></svg>
                </button>
                <div class="heading-copy">
                    <h1 id="panel-title">Whatly Settings</h1>
                    <p>Customize your desktop experience</p>
                </div>
            </div>
            <div class="search-field">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9"/></svg>
                <input id="settings-search" type="search" placeholder="Search settings" aria-label="Search Whatly settings" autocomplete="off" spellcheck="false">
                <button id="clear-search" class="icon-button clear-search" type="button" aria-label="Clear search" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18.3 5.71-1.41-1.42L12 9.17 7.11 4.29 5.7 5.71l4.88 4.88-4.88 4.88 1.41 1.42L12 12.01l4.89 4.88 1.41-1.42-4.88-4.88z"/></svg>
                </button>
            </div>
            <p id="search-summary" class="search-summary" aria-live="polite" hidden></p>
        </header>

        <div id="feedback" class="feedback" role="alert" hidden>
            <p id="feedback-message"></p>
            <button id="dismiss-feedback" class="text-button" type="button">Dismiss</button>
        </div>

        <main id="settings-content" class="settings-content" aria-label="Whatly settings" aria-busy="true">
            <div id="loading-settings" class="empty-state" role="status">
                <span class="loading-indicator" aria-hidden="true"></span>
                <p>Loading your settings…</p>
            </div>
            <div id="settings-sections"></div>
            <div id="no-results" class="empty-state" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9"/></svg>
                <h2>No settings found</h2>
                <p>Try a different word or clear your search.</p>
            </div>
        </main>
    </div>
</body>
</html>
